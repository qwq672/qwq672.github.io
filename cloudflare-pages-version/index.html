      rel="stylesheet"
    />

    <!-- Anti-FOUC theme bootstrap: applies the stored theme BEFORE first
         paint so there's no flash of the wrong theme. Mirrors what
         next-themes does internally on the server. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          // Default to dark — matches the main project's defaultTheme="dark".
          var isDark = stored ? stored === "dark" : true;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
