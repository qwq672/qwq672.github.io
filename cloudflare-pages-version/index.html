<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" type="image/webp" href="./icon-48.webp" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>qwq672 · 随笔与小破站</title>
    <meta
      name="description"
      content="qwq672 的个人小站 — 学生 / 老设备折腾者 / Minecraft 模组作者 / 音乐小白。游戏、复古、代码、碎碎念，都丢在这啦。"
    />

    <!-- Fonts: load via Google Fonts CSS (the main Next.js project bundles
         them with next/font; for a static SPA we just use the stylesheet.
         Space Grotesk + Inter + Noto Sans/Serif SC + JetBrains Mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Avoid theme flash: read the persisted theme (or default dark) before
         the React tree mounts, so the <html> class is correct on first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            document.documentElement.classList.toggle("dark", t === "dark");
          } else {
            // Default to dark (matches the main Next.js site)
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
