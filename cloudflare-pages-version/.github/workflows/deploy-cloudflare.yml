# Deploy the static site to Cloudflare Pages.
#
# Builds the Vite SPA (with build-time data generation) and publishes the
# dist/ folder via wrangler. Requires CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID as repository secrets (or Cloudflare's native
# Pages integration — see README for the simpler UI-driven approach).
#
# This workflow assumes the project files live at the repository root.
# If you keep the project in a subdirectory, prepend that path to the
# `working-directory` fields.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (generates JSON data + Vite build)
        run: bun run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=qwq672
